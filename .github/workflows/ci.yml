name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The registry is generated, so a stale checklist.json means the committed
      # contract and its generator disagree about what an audit covers.
      - name: Registry is in step with its generator
        run: python skills/seo-checklist/tools/build_checklist.py --check

      # Every test here is offline by design: nothing in CI should depend on a
      # live site, an API key, or somebody's Search Console property.
      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Scripts compile
        run: |
          python -m compileall -q skills/seo-checklist/scripts skills/seo-checklist/tools

      # An assertion whose pattern cannot match anything its script emits reports
      # PASS for every site, silently. Fifteen were in that state, one of them a
      # critical item. A test covers this; the step makes the failure legible.
      - name: No assertion can never fire
        run: python skills/seo-checklist/tools/audit_assertions.py

      # The Public Suffix List is a dated artifact. Its absence is not a crash,
      # it is a quiet downgrade to the heuristic it replaced, so the shipped
      # snapshot is checked rather than assumed. --check downloads nothing.
      - name: Public suffix snapshot ships and is dated
        run: python skills/seo-checklist/tools/refresh_public_suffix_list.py --check

      # A smoke run against a local page proves the whole path still works end to
      # end — registry, runner, report — without touching the network.
      - name: Offline smoke run
        run: |
          mkdir -p /tmp/site
          cat > /tmp/site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <title>CI smoke page</title>
          <meta name="description" content="A page used only to prove the audit runs end to end.">
          <link rel="canonical" href="https://ci.example/"></head>
          <body><h1>CI smoke page</h1><p>Body copy.</p></body></html>
          HTML
          python skills/seo-checklist/scripts/checklist_runner.py https://ci.example/ \
              --archive /tmp/site --no-history --quiet
          python skills/seo-checklist/scripts/checklist_report.py checklist-results.json --no-html
          python skills/seo-checklist/scripts/checklist_report.py checklist-results.json --no-html --lang ru

      # A site that cannot be read must produce no score. Evidence scripts exit 0
      # with empty output when they fetch nothing, and empty output satisfies the
      # assertions this registry is built from — that combination once scored a
      # host that does not resolve at 61/100. Unit tests cover the gate; this
      # proves the whole path still honours it.
      - name: An unreachable site gets no score
        run: |
          python skills/seo-checklist/scripts/checklist_runner.py \
              https://unreachable.invalid/ --mode page --no-history --no-prompt \
              --quiet --timeout 20 --json dead.json > dead.log 2>&1 || true
          grep -q UNREACHABLE dead.log || { echo "no unreachable warning"; cat dead.log; exit 1; }
          if grep -q "SEO Score" dead.log; then echo "scored a site it never read"; exit 1; fi
          python - <<'PY'
          import json
          d = json.load(open("dead.json"))
          assert d["entry_reachable"] is False, "entry_reachable not recorded"
          assert d["scores"]["decided"] == 0, f"decided {d['scores']['decided']} items"
          bad = [i["id"] for i in d["items"] if i["status"] in ("PASS", "FAIL", "WARN")]
          assert not bad, f"verdicts without a site: {bad[:5]}"
          PY

      # The other half of the same failure, and the harder half: a bot-protection
      # challenge and a soft 404 answer 200 with well-formed HTML, so the status
      # gate above waves them through and every script grades an interstitial as
      # if it were the site. Run offline against saved copies of both, which is
      # exactly the shape of the real thing.
      - name: A challenge page and a soft 404 get no score
        run: |
          mkdir -p /tmp/challenge /tmp/soft404
          cat > /tmp/challenge/index.html <<'HTML'
          <!doctype html><html><head><title>Just a moment...</title></head>
          <body><h1>Checking your browser</h1>
          <script src="/cdn-cgi/challenge-platform/h/b/orchestrate/chl_page/v1"></script>
          </body></html>
          HTML
          cat > /tmp/soft404/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <title>404 Not Found | Example Shop</title>
          <link rel="canonical" href="https://example.com/missing"></head>
          <body><h1>Page not found</h1><p>Try the homepage.</p></body></html>
          HTML
          for kind in challenge soft404; do
            python skills/seo-checklist/scripts/checklist_runner.py https://example.com/ \
                --archive /tmp/$kind --no-history --no-prompt --quiet \
                --json $kind.json > $kind.log 2>&1
            if grep -q "SEO Score" $kind.log; then
              echo "scored a $kind page"; cat $kind.log; exit 1
            fi
            python - "$kind" <<'PY'
          import json, sys
          kind = sys.argv[1]
          d = json.load(open(f"{kind}.json"))
          assert d["entry_guard"], f"{kind}: guard did not fire"
          assert d["entry_guard_enforced"] is True, f"{kind}: guard not enforced"
          assert d["scores"]["decided"] == 0, f"{kind}: decided {d['scores']['decided']}"
          bad = [i["id"] for i in d["items"] if i["status"] in ("PASS", "FAIL", "WARN")]
          assert not bad, f"{kind}: verdicts on the wrong page: {bad[:5]}"
          PY
          done

      # And the mirror image: an article that quotes a vendor's challenge string
      # in its prose is a real page and must still be audited. Refusing to audit
      # it would be the same bug pointing the other way.
      - name: An article about bot protection is still audited
        run: |
          mkdir -p /tmp/article
          cat > /tmp/article/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <title>How to fix 404 errors on your site | Example</title>
          <meta name="description" content="Finding and fixing broken links and soft 404s.">
          <link rel="canonical" href="https://example.com/fix-404"></head>
          <body><h1>How to fix 404 errors</h1><p>Cloudflare serves its interstitial
          from cdn-cgi/challenge-platform, which is why a crawler sees something
          different from a browser.</p></body></html>
          HTML
          python skills/seo-checklist/scripts/checklist_runner.py https://example.com/ \
              --archive /tmp/article --no-history --no-prompt --quiet \
              --json article.json > article.log 2>&1
          grep -q "SEO Score" article.log || {
            echo "refused to audit a real page"; cat article.log; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open("article.json"))
          assert d["entry_guard"] is None, f"guard fired on a real page: {d['entry_guard']}"
          assert d["scores"]["decided"] > 0, "decided nothing on a readable page"
          PY

      # The live path, against a site this job serves itself.
      #
      # Everything above is offline, and offline is where the worst bug in this
      # plugin's history hid: a slot file opened "a+" appended instead of replacing,
      # float() raised out of the rate limiter, and 36 of 56 evidence scripts
      # crashed in a live run while every test passed. Nothing offline could have
      # caught it — a single process writing to a fresh file never appends twice.
      #
      # It could not be tested because the SSRF guard had no way through, so the
      # only live target available was somebody else's website. --allow-private is
      # what makes this step possible, and this step is most of why it exists.
      - name: The full live path, against a locally served fixture site
        run: |
          python -m http.server 8000 --directory tests/fixtures/site > server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8000/ && break || sleep 0.5
          done
          curl -sf -o /dev/null http://127.0.0.1:8000/ || { echo "fixture server never came up"; exit 1; }

          # The guard first: the default must still refuse. If this ever passes,
          # every audit is one DNS answer away from reaching a private network.
          python skills/seo-checklist/scripts/checklist_runner.py http://127.0.0.1:8000/ \
              --no-history --no-prompt --quiet --timeout 60 --json blocked.json \
              > blocked.log 2>&1 || true
          grep -q "private/internal IP" blocked.log || {
            echo "the SSRF guard did not refuse a loopback host by default"
            cat blocked.log; exit 1; }
          if grep -q "SEO Score" blocked.log; then
            echo "scored a host it was not allowed to read"; exit 1; fi

          # Then the real thing: crawl, sample, pace, aggregate, report.
          # SEO_MAX_RPS is raised rather than switched off, deliberately — the
          # pacing must run, with several processes contending for the same slot
          # file, because that contention is the bug this step exists to catch.
          python skills/seo-checklist/scripts/checklist_runner.py http://127.0.0.1:8000/ \
              --allow-private --sample 3 --max-rps 50 --no-history --no-prompt \
              --timeout 90 --json live.json > live.log 2>&1
          grep -q "SEO Score" live.log || {
            echo "no score"; cat live.log; tail -40 server.log; exit 1; }
          # Not decoration: this is the size of the request fan-out, and the number
          # the shared-crawl work exists to bring down. Five crawlers walk the same
          # pages independently and 36 scripts each re-fetch the entry URL, with no
          # HTTP cache anywhere. Printing it means a change that makes it worse is
          # visible in the build log rather than only on somebody else's server.
          echo "one audit of a 6-page site made $(grep -c '"GET' server.log) requests"
          python skills/seo-checklist/scripts/checklist_report.py live.json \
              --markdown live.md --html live.html --llm-queue live-queue.md > report.log 2>&1
          python - <<'PY'
          import json
          d = json.load(open("live.json"))

          # The assertion this whole step is for. Every one of these is a script
          # that failed against a site that was serving perfectly.
          assert not d["script_failures"], (
              f"scripts failed against the fixture site: {d['script_failures']}\n"
              + "\n".join(f"  {k}: {v['error']}" for k, v in d["runs"].items()
                          if v.get("error")))

          assert d["allow_private"] is True, "the flag is not in the artifact"
          assert d["entry_private"] is True, "a loopback host was not recognised as private"
          assert d["entry_reachable"] is True and not d["entry_guard"], d.get("entry_error")
          assert d["scores"]["decided"] > 50, (
              f"only {d['scores']['decided']} items decided — the evidence layer "
              f"did not really run")
          assert len(d["sampled_urls"]) > 1, "sampling found nothing to sample"

          # An external service cannot reach a host on this runner, so those items
          # are NO_DATA with that reason — not crashes, and not N/A: they apply to
          # this site, they just cannot be answered here.
          outside = [i for i in d["items"] if "only reachable from here" in (i.get("evidence") or "")]
          assert outside, "the external-API items were not gated"
          assert all(i["status"] == "NO_DATA" for i in outside), \
              [i["id"] for i in outside if i["status"] != "NO_DATA"]

          # And the deliverable says which kind of audit produced it.
          html, md = open("live.html").read(), open("live.md").read()
          for name, text in (("html", html), ("markdown", md)):
              assert "--allow-private" in text, f"{name} does not say the host was private"
          print(f"live path OK: {d['scores']['seo_score']}/100 at "
                f"{d['scores']['coverage_pct']}% over {len(d['runs'])} script runs")
          PY

          # The fixture's planted defects, checked against the evidence layer
          # directly. A run that finds nothing wrong with a site built to be wrong
          # has stopped measuring and nobody would notice from the score alone.
          SEO_ALLOW_PRIVATE=1 SEO_MAX_RPS=50 python \
              skills/seo-checklist/scripts/orphan_pages_from_sitemap.py \
              http://127.0.0.1:8000/ --json > orphans.json
          python - <<'PY'
          import json
          d = json.load(open("orphans.json"))
          # /orphan.html is in the sitemap and linked from nowhere: a real orphan.
          assert d["orphan_pages"] == ["http://127.0.0.1:8000/orphan.html"], d["orphan_pages"]
          # /private/secret.html is in the sitemap and disallowed in robots.txt. It
          # is also linked from nowhere, so the crawl never tried it and never
          # recorded a refusal — and it was counted as an orphan, which turns our own
          # politeness into the site's defect. That is the ordinary case, not an edge
          # one: a page is usually unlinked because it is blocked.
          assert d["sitemap_urls_blocked_by_robots"] == [
              "http://127.0.0.1:8000/private/secret.html"], d["sitemap_urls_blocked_by_robots"]
          assert "sitemap_robots_conflict" in [i["type"] for i in d["issues"]]
          print("orphan and robots arithmetic OK")
          PY

      # robots.txt governs what the tool discovers, never what it was handed. Both
      # halves fail silently if reversed: a blanket check would refuse the 40-odd
      # scripts that fetch {url} and collapse the audit to NO_DATA, while no check
      # at all crawls somebody's site against their stated wishes. The signature
      # default is the whole guarantee, so it is asserted here as well as in the
      # test suite — this one runs even if the suite is skipped.
      - name: robots.txt applies to discovered URLs, not to the audit target
        run: |
          cd skills/seo-checklist/scripts
          python - <<'PY'
          import inspect, sys
          sys.path.insert(0, ".")
          from lib import safe_http as sh
          import seo_common

          for fn in (sh.safe_request, seo_common.fetch_url):
              d = inspect.signature(fn).parameters["respect_robots"].default
              assert d is False, f"{fn.__qualname__} opts in by default ({d!r})"

          assert "/" not in sh.ROBOTS_TOKEN, (
              "the token must be bare: RobotFileParser splits the agent at '/', so a "
              "full User-Agent makes rules naming us silently inapplicable")

          sh._fetch_robots = lambda origin: (_ for _ in ()).throw(RuntimeError("down"))
          assert sh.robots_allows("https://example.com/x") == (True, 0.0), (
              "an unreachable robots.txt must allow, not fail the audit")

          sh._fetch_robots = lambda origin: f"User-agent: {sh.ROBOTS_TOKEN}\nDisallow: /no\n"
          import shutil, tempfile
          sh.RATE_LIMIT_DIR = tempfile.mkdtemp()
          assert sh.robots_allows("https://example.com/no/x")[0] is False
          assert sh.robots_allows("https://example.com/yes")[0] is True
          shutil.rmtree(sh.RATE_LIMIT_DIR, ignore_errors=True)
          print("robots policy holds")
          PY
